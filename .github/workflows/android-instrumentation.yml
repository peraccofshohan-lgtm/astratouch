name: Android Instrumentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-tests:
    name: "Instrumentation tests (API ${{ matrix.api }})"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 33
            target: google_apis
          - api: 36
            target: google_apis
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p build-logs
            set -o pipefail
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain 2>&1 | tee build-logs/instrumentation.log

      - name: Report failures as annotations
        if: failure()
        run: bash .github/scripts/report-failure.sh build-logs

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports-api${{ matrix.api }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            build-logs/**
          if-no-files-found: warn
          retention-days: 14
