name: Android PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: "Verify pull request"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Assemble and unit test
        run: |
          mkdir -p build-logs
          set -o pipefail
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee build-logs/pr.log

      - name: Lint
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --no-daemon --console=plain 2>&1 | tee build-logs/pr-lint.log

      - name: Report failures as annotations
        if: failure()
        run: bash .github/scripts/report-failure.sh build-logs

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            build-logs/**
          if-no-files-found: warn
          retention-days: 7
